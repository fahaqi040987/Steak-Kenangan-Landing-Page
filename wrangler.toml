# Cloudflare Workers static-assets configuration.
#
# The static export from `npm run build` is served as Worker assets — no
# server code runs, so [observability.logs] / [observability.traces] remain
# unnecessary (they capture Worker-script telemetry; add them only if this
# project ever gains a Worker script, e.g. @opennextjs/cloudflare).
#
#   npm run deploy          production deploy (main)
#   npm run deploy:preview  branch Preview — requires wrangler >= 4.135.0
#                           (see developers.cloudflare.com/workers/previews/)
name = 'steak-kenangan-landing-page'
compatibility_date = "2026-01-01"

[assets]
directory = "./out"
not_found_handling = "404-page" # serve out/404.html with a 404 status
